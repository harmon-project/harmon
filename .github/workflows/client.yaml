name: client

on:
  push:
    paths:
      - client/**
      - .github/workflows/client.yaml
    branches: ["main"]

permissions:
  contents: write
  pages: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build dependencies
        run: |
          sudo apt update -y && \
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            openjdk-21-jdk-headless \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build lib
        shell: bash
        run: |
          cd lib
          npm ci
          npm run build

      - name: Build
        shell: bash
        run: |
          cd client && \
          cp .env.example .env && \
          npm ci && \
          npm run tauri icon ./src/lib/assets/icon.png && \
          npm run tauri build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: harmon-html
          path: client/build
          if-no-files-found: error

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmon-appimage
          path: client/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload Deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmon-deb
          path: client/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error

      - name: Upload Rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmon-rpm
          path: client/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build lib
        shell: bash
        run: |
          cd lib
          npm ci
          npm run build

      - name: Build client
        shell: bash
        run: |
          cd client
          cp .env.example .env
          npm ci
          npm run tauri icon ./src/lib/assets/icon.png
          npm run tauri build

      - name: Upload Windows NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmon-windows
          path: client/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: harmon-windows-msi
          path: client/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows

    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: harmon-appimage
          path: release/appimage
          merge-multiple: true

      - name: Download Deb artifact
        uses: actions/download-artifact@v4
        with:
          pattern: harmon-deb
          path: release/deb
          merge-multiple: true

      - name: Download Rpm artifact
        uses: actions/download-artifact@v4
        with:
          pattern: harmon-rpm
          path: release/rpm
          merge-multiple: true

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          pattern: harmon-windows
          path: release/windows
          merge-multiple: true

      - name: Download Windows MSI artifact
        uses: actions/download-artifact@v4
        with:
          pattern: harmon-windows-msi
          path: release/windows-msi
          merge-multiple: true

      - name: Release nightly
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          name: nightly
          tag_name: nightly
          files: |
            release/appimage/*.AppImage
            release/deb/*.deb
            release/rpm/*.rpm
            release/windows/*.exe
            release/windows-msi/*.msi
          fail_on_unmatched_files: true

  deploy-pages:
    runs-on: ubuntu-latest
    needs: build-linux
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: harmon-html
